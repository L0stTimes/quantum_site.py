<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quantum site</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.52.1/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.52.1/build/stlite.js"></script>
  <script>
    async function main() {
      const code = await (await fetch("app/app.py")).text();
      stlite.mount(
        {
          requirements: ["numpy", "matplotlib"],
          entrypoint: "app.py",
          files: { "app.py": code },
        },
        document.getElementById("root")
      );
    }
    main();
  </script>
</body>
</html>
